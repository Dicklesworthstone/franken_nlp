# Historical record only. FrankenNLP uses occasional controller-authorized DSR
# runs of scripts/check.sh as its sole code/build authority. This retained file
# intentionally has no automatic, manual, reusable, or scheduled trigger.
name: CI (historical; inert)

on: {}

jobs:
  check:
    # Defense in depth if a trigger is ever added accidentally. Re-enabling this
    # job requires an explicit owner policy change and corresponding plan update.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-msvc
      - name: Run the single repository check entrypoint
        run: scripts/check.sh
